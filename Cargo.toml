[workspace]
members = [
    "crates/lambert_izzo",
    "crates/lambert_izzo_wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lambert_izzo = { path = "crates/lambert_izzo" }
nalgebra = "0.34"
serde = "1"
serde-wasm-bindgen = "0.6"
thiserror = "2"
tsify = "0.5"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
