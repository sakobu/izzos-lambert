[package]
name = "lambert_izzo"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Izzo's revisited Lambert solver (single & multi-rev, short & long way), no_std-friendly"
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lambert_izzo"
keywords = ["astrodynamics", "lambert", "orbital-mechanics", "izzo", "no_std"]
categories = ["science", "aerospace", "no-std"]

[features]
default = []
# Adds Serialize/Deserialize derives on every public type, including
# LambertError. Pulls in serde and arrayvec/serde.
serde = ["dep:serde", "arrayvec/serde"]
# Promotes the test-only Kepler propagator to a public function under
# `lambert_izzo::test_utils::kepler_propagate`. Used by downstream
# integration tests that want to round-trip-validate Lambert solutions
# without re-implementing the propagator.
test-utils = []
# Enables `lambert_par_iter`, a parallel batch iterator backed by Rayon.
# Pulls in `std` transitively through Rayon — incompatible with no_std.
rayon = ["dep:rayon"]

[dependencies]
arrayvec = { workspace = true }
num-traits = { workspace = true }
rayon = { version = "1", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "html_reports"] }
nalgebra = { workspace = true }
glam = "0.29"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

[[bench]]
name = "single_rev"
harness = false

[[bench]]
name = "multi_rev"
harness = false

[[bench]]
name = "batch"
harness = false
